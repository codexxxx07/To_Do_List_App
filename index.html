<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A premium skeuomorphic to-do list with drag-and-drop, filters, and dark mode."
    />
    <title>To-Do List App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dest/output.css" />
  </head>
  <body class="min-h-dvh flex items-center justify-center p-4 sm:p-8">
    <!-- Ambient background -->
    <div class="bg-scene" aria-hidden="true">
      <div class="bg-orb bg-orb-1 w-72 h-72 -top-20 -left-20"></div>
      <div class="bg-orb bg-orb-2 w-96 h-96 top-1/3 -right-32"></div>
      <div class="bg-orb bg-orb-3 w-64 h-64 bottom-0 left-1/4"></div>
    </div>

    <main
      class="glass-card w-full max-w-lg rounded-3xl p-6 sm:p-8"
      role="application"
      aria-label="To-Do List application"
    >
      <!-- Header -->
      <header class="flex items-start justify-between gap-4 mb-8">
        <div>
          <h1 class="font-display text-2xl sm:text-3xl font-bold header-gradient">
            To-Do List App
          </h1>
          <p class="text-theme-secondary text-sm mt-1">
            Craft your day, one tile at a time
          </p>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle dark mode"
          title="Toggle theme"
        >
          <span id="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </header>

      <!-- Add task -->
      <form id="task-form" class="flex gap-3 mb-6" autocomplete="off">
        <label for="task-input" class="sr-only">New task</label>
        <input
          type="text"
          id="task-input"
          class="skeuo-input flex-1 min-w-0 rounded-2xl px-4 py-3.5 text-sm sm:text-base font-medium"
          placeholder="What needs doing?"
          maxlength="200"
        />
        <label for="task-date" class="sr-only">Due date</label>
        <input
          type="date"
          id="task-date"
          class="skeuo-input skeuo-date shrink-0 w-[9.25rem] sm:w-[10.25rem] rounded-2xl px-2.5 sm:px-3 py-3.5 text-xs sm:text-sm font-medium text-theme-secondary"
          title="Due date"
        />
        <button
          type="submit"
          id="add-btn"
          class="skeuo-btn rounded-2xl px-5 py-3.5 font-display font-semibold text-sm sm:text-base whitespace-nowrap"
          aria-label="Add task"
        >
          Add
        </button>
      </form>

      <!-- Filter tabs -->
      <nav class="filter-tabs mb-5" role="tablist" aria-label="Filter tasks">
        <div id="tab-indicator" class="tab-indicator" aria-hidden="true"></div>
        <button
          type="button"
          role="tab"
          class="filter-tab active"
          data-filter="all"
          aria-selected="true"
        >
          All
        </button>
        <button
          type="button"
          role="tab"
          class="filter-tab"
          data-filter="active"
          aria-selected="false"
        >
          Active
        </button>
        <button
          type="button"
          role="tab"
          class="filter-tab"
          data-filter="completed"
          aria-selected="false"
        >
          Done
        </button>
      </nav>

      <!-- Task list -->
      <section aria-live="polite" aria-relevant="additions removals">
        <ul id="task-list" class="space-y-3 min-h-[4rem]"></ul>

        <!-- Empty state -->
        <div id="empty-state" class="hidden text-center py-12 px-4">
          <div class="empty-icon-wrap animate-breathe" aria-hidden="true">
            ✨
          </div>
          <h2 class="font-display text-lg font-semibold text-theme-primary mb-2">
            Your canvas is clear
          </h2>
          <p class="text-theme-secondary text-sm max-w-xs mx-auto leading-relaxed">
            No tasks yet — add something above and watch it slide into place like
            a physical tile.
          </p>
        </div>
      </section>

      <!-- Footer -->
      <footer
        class="flex flex-wrap items-center justify-between gap-3 mt-6 mb-6 pt-5 border-t border-white/20 dark:border-slate-600/30"
      >
        <p id="task-counter" class="text-theme-secondary text-sm font-medium">
          <span id="remaining-count">0</span> tasks remaining
        </p>
        <button
          type="button"
          id="clear-completed"
          class="ghost-btn hidden"
          aria-label="Clear completed tasks"
        >
          Clear completed
        </button>
      </footer>

      <!-- Skeuomorphic page footer -->
      <footer
        class="task-tile w-full rounded-2xl px-4 py-3 mt-10"
        style="background: linear-gradient(145deg, var(--surface-raised) 0%, var(--surface) 100%); opacity: 0.7;"
      >
        <p class="text-center text-sm">
          © 2026 Krish | Built with ❤️ and Code | All Rights Reserved
        </p>
      </footer>
    </main>

    <!-- Validation popup -->
    <div
      id="validation-popup"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="popup-message"
      aria-hidden="true"
    >
      <div
        id="popup-backdrop"
        class="absolute inset-0 bg-slate-900/25 dark:bg-black/45 backdrop-blur-[2px] opacity-0 transition-opacity duration-300"
        aria-hidden="true"
      ></div>
      <div
        class="validation-modal relative w-full max-w-sm rounded-3xl p-6 sm:p-7 opacity-0 scale-95 transition-all duration-300 ease-tactile"
        id="popup-panel"
      >
        <button
          type="button"
          id="popup-close"
          class="popup-close-btn absolute top-4 right-4"
          aria-label="Close dialog"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="popup-icon-wrap mb-4" aria-hidden="true">⚠️</div>
        <p
          id="popup-message"
          class="font-display text-base sm:text-lg font-semibold text-theme-primary text-center leading-snug pr-6"
        ></p>
        <button
          type="button"
          id="popup-ok"
          class="skeuo-btn mt-6 w-full rounded-2xl py-3 font-display font-semibold text-sm sm:text-base"
        >
          Got it
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
